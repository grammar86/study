<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta content="IE=edge" http-equiv="X-UA-Compatible">
<meta name="viewport" content="width=device-width,initial-scale=1.0,minimum-scale=1.0,maximum-scale=1.0,user-scalable=no,viewport-fit=cover" />
<title>집코드 파인더</title>
<link href="./static/css/ui.min.css" rel="stylesheet" />
<script type="text/javascript" src="./static/js/common.js"></script>
<script type="text/javascript" src="./static/js/ui.js"></script>
<style>
    .blind { overflow: hidden; display: inline-block; position: absolute; z-index:-10; width:0; height:0;}
    [role=dialog] { position:fixed; bottom:0; left:0; right:0; z-index:10; min-height:90vh; touch-action: none; overscroll-behavior: none; user-select: none; -webkit-tap-highlight-color: transparent; background:#fff; border:1px solid red; padding:20px;}
    [role=dialog] * { user-select: none;-webkit-tap-highlight-color:revert;}
    [role=dialog] [role=combobox] { border:1px solid #000; padding:10px;}
    [role=dialog] .listbox { overflow-y:auto; right:20px; max-height:100px; border:1px solid #e5e5e5; background:#fff;}
    [role=dialog] [role=listbox]::-webkit-scrollbar { display: none;}
    [role=dialog] [role=listbox] div { display: flex; height:40px; padding:0 20px; align-items: center;}
    
    /* --------------------------------------------------
       [교정] 가로 스크롤 영역 레이아웃
    -------------------------------------------------- */
    .scroll-box { 
        display: flex; 
        overflow-x: auto;                  /* [필수] 가로 스크롤 활성화 */
        overflow-y: hidden;                /* 세로 축 고정 */
        max-height: 100px; 
        border: 1px solid #e5e5e5; 
        background: #fff;
        -webkit-overflow-scrolling: touch; /* iOS 터치 감도 최적화 */
        
        /* [스크롤 스냅 추가] 보이스오버 가상 커서가 요소를 화면 안에 넣으려고 할 때, 
           브라우저 엔진 단에서 스크롤을 끝까지 강제로 자석처럼 착 붙여주는 역할을 합니다. */
        scroll-snap-type: x mandatory;
        scroll-padding-right: 20px;        /* 우측 끝 여백 확보 */
    }
    .scroll-box::-webkit-scrollbar { display: none; }
    
    .scroll-box > * { 
        flex: 0 0 auto; 
        display: flex; 
        width: 250px; 
        height: 40px; 
        padding: 0 20px; 
        align-items: center; 
        background: skyblue;
        
        /* [스크롤 스냅 추가] 각 아이템이 시작점(좌측) 기준으로 스냅되도록 설정 */
        scroll-snap-align: start;
    }
    .scroll-box > *:nth-child(even) { background: hotpink; }

    /* [iOS 버그 우회 핵심 CSS]
       컨텐츠가 딱 2개뿐일 때 iOS WebKit은 우측 스크롤 여백 계산을 포기하고 멈춰버립니다.
       HTML 구조를 건드리지 않는 대신, CSS 가상 요소로 2번째 컨텐츠 뒤에 숨은 여백 공간을 물리적으로 추가합니다.
       이렇게 하면 보이스오버 커서가 이동할 때 브라우저가 스크롤을 멈추지 않고 끝까지 밀어줍니다. */
    .scroll-box::after {
        content: '';
        flex: 0 0 30px; /* 오른쪽 끝에 남겨두고 싶은 여백 크기 */
        display: block;
    }
</style>
<script>
    // 문서가 로드된 후 스크립트 실행
    window.addEventListener('DOMContentLoaded', () => {
        const scrollContainer = document.querySelector('.scroll-box');
        if (!scrollContainer) return;

        const items = scrollContainer.querySelectorAll(':scope > div');
        if (items.length < 2) return;

        // [IntersectionObserver 활용]
        // 보이스오버 커서가 이동(쓸어넘기기)할 때 focus 이벤트는 터지지 않지만,
        // 화면 밖 우측에 잘려 있던 2번째 div를 읽기 위해 브라우저가 요소를 화면 안으로 '아주 미세하게' 노출시킵니다.
        // 이때 화면에 표시되는 교차비율(Intersection) 변화를 감지하여 자바스크립트로 스크롤을 완전히 끝까지 밀어버립니다.
        const observerOptions = {
            root: scrollContainer,
            threshold: 0.85 // 2번째 컨텐츠가 화면에 85% 이상 완전히 들어왔는지 감시
        };

        const observer = new IntersectionObserver((entries) => {
            entries.forEach(entry => {
                // 2번째 컨텐츠가 완전히 다 보이지 않고 우측이 잘려 있는 상태(isIntersecting = false)에서
                // 보이스오버 가상 커서가 접근해 인지하기 시작하는 순간 작동합니다.
                if (!entry.isIntersecting && entry.target === items[1]) {
                    // 강제로 가로 스크롤을 끝(inline: 'end')까지 이동시킵니다.
                    entry.target.scrollIntoView({
                        behavior: 'smooth',
                        block: 'nearest',
                        inline: 'end'
                    });
                }
            });
        }, observerOptions);

        // 딱 2개뿐인 컨텐츠 중, 문제가 발생하는 '2번째 컨텐츠'만 감시관찰 대상에 등록합니다.
        observer.observe(items[1]);
    });
</script>
</head>
<body>
    <!-- 컨텐츠 영역 (기존 마크업 구조 원본 유지) -->
    <div id="container">
        <div class="innerbox">
            <div class="scroll-box">
                <div>컨텐츠1컨텐츠1컨텐츠1컨텐츠1</div>
                <div>컨텐츠2컨텐츠2컨텐츠2컨텐츠2</div>
            </div>
        </div>
    </div>
    <!-- //컨텐츠 영역 -->
</body>
</html>
