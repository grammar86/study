<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta content="IE=edge" http-equiv="X-UA-Compatible">
<meta name="viewport" content="width=device-width,initial-scale=1.0,minimum-scale=1.0,maximum-scale=1.0,user-scalable=no,viewport-fit=cover" />
<title>집코드 파인더</title>
<link href="./static/css/ui.min.css" rel="stylesheet" />
<script type="text/javascript" src="./static/js/common.js"></script>
<script type="text/javascript" src="./static/js/ui.js"></script>
<style>
    .blind { overflow: hidden; display: inline-block; position: absolute; z-index:-10; width:0; height:0;}
    [role=dialog] { position:fixed; bottom:0; left:0; right:0; z-index:10; min-height:90vh; touch-action: none; overscroll-behavior: none; user-select: none; -webkit-tap-highlight-color: transparent; background:#fff; border:1px solid red; padding:20px;}
    [role=dialog] * { user-select: none;-webkit-tap-highlight-color:revert;}
    [role=dialog] [role=combobox] { border:1px solid #000; padding:10px;}
    [role=dialog] .listbox { overflow-y:auto; right:20px; max-height:100px; border:1px solid #e5e5e5; background:#fff;}
    [role=dialog] [role=listbox]::-webkit-scrollbar { display: none;}
    [role=dialog] [role=listbox] div { display: flex; height:40px; padding:0 20px; align-items: center;}
    
    /* 1. CSS 오타 수정 (overflow-y -> overflow-x) */
    .scroll-box { display:flex; overflow-x:auto; max-height:100px; border:1px solid #e5e5e5; background:#fff; -webkit-overflow-scrolling: touch;}
    .scroll-box::-webkit-scrollbar { display: none;}
    .scroll-box > * { flex:0 0 auto; display: flex; width:250px; height:40px; padding:0 20px; align-items: center; background:skyblue;}
    .scroll-box > *:nth-child(even) {background:hotpink;}
</style>
<script>
    // 페이지 로드 후 실행 (제공해주신 스크립트 영역)
    window.addEventListener('DOMContentLoaded', () => {
        const scrollContainer = document.querySelector('.scroll-box');
        if (!scrollContainer) return;

        const items = scrollContainer.querySelectorAll(':scope > div');

        // [핵심] HTML을 수정하지 않는 대신, 스크립트가 로드되면 자식 div들에 초점을 받을 수 있도록 만듭니다.
        // 이렇게 하면 iOS 보이스오버 가상 커서가 지나갈 때 브라우저가 실제 '포커스' 이벤트를 발생시킵니다.
        items.forEach(item => {
            item.setAttribute('tabindex', '0');
            // 키보드/스크린리더 포커스 시 아웃라인 스타일이 깨지지 않도록 초기화 (선택 사항)
            item.style.outline = 'none'; 
        });

        // 보이스오버 커서 이동 시 포커스 감지 이벤트 트리거
        scrollContainer.addEventListener('focusin', (event) => {
            const focusedItem = event.target;
            
            // 포커스된 요소가 스크롤 박스의 직계 자식이 맞는지 확인
            if (focusedItem.parentElement === scrollContainer) {
                // 웹킷 엔진의 버그를 무시하고 강제로 끝까지 스크롤을 밀어버림
                focusedItem.scrollIntoView({
                    behavior: 'smooth',
                    block: 'nearest',
                    inline: 'end' // 2번째 카드가 우측 정렬되어 완전히 보이도록 처리
                });
            }
        });
    });
</script>
</head>
<body>
    <!-- 컨텐츠 영역 (구조 전혀 변경 없음) -->
    <div id="container">
        <div class="innerbox">
            <div class="scroll-box">
                <div>컨텐츠1컨텐츠1컨텐츠1컨텐츠1</div>
                <div>컨텐츠2컨텐츠2컨텐츠2컨텐츠2</div>
            </div>
        </div>
    </div>
    <!-- //컨텐츠 영역 -->
</body>
</html>
